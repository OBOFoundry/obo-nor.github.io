title: "OBO Dashboard: New Ontology Requests"
description: "Dashboard for checking new ontology requests to the OBO Foundry. Under construction."
obo_score_weights:
  no_base:
    impact_factor: 5
    max_impact: 5
  overall_error:
    impact_factor: 5
    max_impact: 20
  overall_warning:
    impact_factor: 0.5
    max_impact: 10
  overall_info:
    impact_factor: 0.1
    max_impact: 5
  report_errors:
    impact_factor: 0.05
    max_impact: 10
  report_warning:
    impact_factor: 0.01
    max_impact: 5
  report_info:
    impact_factor: 0.005
    max_impact: 3
  impact:
    impact_factor: 1
    max_impact: 1 
  dashboard:
    impact_factor: 1
    max_impact: 1
ontologies:
  #registry: "https://raw.githubusercontent.com/OBOFoundry/OBOFoundry.github.io/master/registry/ontologies.yml"
  custom:
    - id: cmeo
      mirror_from: https://raw.githubusercontent.com/komi786/cmeo/main/cmeo.owl
      title: "Clinical Metadata Exploration Ontology"
      contact:
        email: komalsyeda29@gmail.com
        label: Komal Gilani
        orcid: 0000-0001-7292-1026
        github: komi786
      description: CMEO (Clinical Metadata Exploration Ontology) is a semantic model for representing and querying clinical cohort study metadata to enable cross-study discovery and metadata-driven harmonization.
      domain: health
      homepage: https://komi786.github.io/cmeo/
      products:
        - id: cmeo-core.owl
      tracker: https://github.com/komi786/cmeo/issues
      license:
        url: https://creativecommons.org/licenses/by/4.0/
        label: CC BY 4.0
      base_ns:
        - http://purl.obolibrary.org/obo/CMEO_
    - id: idpo
      mirror_from: https://github.com/BioComputingUP/idpo/releases/download/v2025-10-01/idpo.owl
      title: "Intrinsically Disordered Proteins Ontology"
      contact:
        email: ximena.castro@unipd.it
        label: Ximena Aixa Castro Naser
        orcid: 0000-0002-9211-1255
        github: XimeAixa
      description: The Intrinsically Disordered Proteins Ontology (IDPO) defines concepts and relationships for the states, transitions, and functional roles of intrinsically disordered proteins and regions.
      domain: biochemistry
      homepage: https://github.com/BioComputingUP/idpo
      products:
        - id: idpo.owl
      tracker: https://github.com/BioComputingUP/idpo/issues
      license:
        url: https://creativecommons.org/licenses/by/4.0/
        label: CC BY 4.0
      base_ns:
        - http://purl.obolibrary.org/obo/IDPO_
    - id: promot
      mirror_from: https://raw.githubusercontent.com/JuPoIm/promot/master/promot-en.owl
      title: "PROMOT Ontology"
      contact:
        email: juliette.potier@institutimagine.org
        label: Juliette Potier
        orcid: 0009-0000-5160-7927
        github: JuPoIm
      description: PROMOT Ontology describes three groups of neuromuscular diseases, their related gene variants, phenotypes, and affected anatomical entities, body structures, body functions and activities.
      domain: health
      homepage: https://github.com/JuPoIm/promot/
      products:
        - id: promot-en.owl
      tracker: https://github.com/JuPoIm/promot/issues
      license:
        url: https://creativecommons.org/licenses/by/4.0/
        label: CC BY 4.0
      base_ns:
        - http://purl.obolibrary.org/obo/PROMOT_
    - id: euph
      mirror_from: https://gitlab.com/bee-life/controlled-vocabulary/-/raw/V1.4/PolOn_V.1.4_rdf-xml.owl
      title: "Pollinator Ontology"
      contact:
        email: m.rubinigg@visualife.at
        label: "Michael Rubinigg"
        orcid: 0000-0002-7061-920X
        github: visual133
      description: "The Pollinator Ontology (PolOn) is a domain ontology for information and data on pollinators and their interactions with the abiotic and biotic environment, particularly humans."
      domain: "environment"
      homepage: https://app.pollinatorhub.eu/ontology
      products:
        - id: PolOn_V.1.4_rdf-xml.owl
      tracker: https://gitlab.com/bee-life/controlled-vocabulary/-/issues
      license:
        url: https://creativecommons.org/licenses/by/4.0/
        label: "CC BY 4.0"
      base_ns:
        - https://w3id.org/euph/
    - id: fluxo
      mirror_from: https://raw.githubusercontent.com/dtu-qmcm/fluxo/main/fluxo.owl
      title: "Metabolic Flux Analysis Ontology (FLUXO)"
      contact:
        email: techen@dtu.dk
        label: "Te Chen"
        orcid: 0009-0003-4029-9836
        github: teisnotte
      description: "The Metabolic Flux Analysis Ontology (FLUXO) provides an ontology for fluxomics and particularly isotope-based metabolic flux analysis, covering the methods, experiments, software and data involved in determining intracellular metabolic fluxes."
      domain: "biological systems"
      homepage: https://dtu-qmcm.github.io/fluxo/
      products:
        - id: fluxo.owl
      tracker: https://github.com/dtu-qmcm/fluxo/issues
      license:
        url: https://creativecommons.org/licenses/by/4.0/
        label: "CC BY 4.0"
      base_ns:
        - http://purl.obolibrary.org/obo/FLUXO_
    - id: hmdm
      mirror_from: https://raw.githubusercontent.com/raphenya/hmdm-ontology/refs/heads/main/hmdm.owl
      title: "The Human Microbiome Drug Metabolism (HMDM) Ontology"
      contact:
        email: raphenar@mcmaster.ca
        label: "Amogelang R. Raphenya"
        orcid: 0000-0001-9259-5280
        github: raphenya
      description: "The HMDM ontology describes drug metabolism by bacterial enzymes in the human microbiome."
      domain: "information technology"
      homepage: https://github.com/raphenya/hmdm-ontology
      products:
        - id: hmdm.owl
      tracker: https://github.com/raphenya/hmdm-ontology/issues
      license:
        url: https://creativecommons.org/licenses/by/4.0/
        label: "CC BY 4.0"
      base_ns:
        - http://purl.obolibrary.org/obo/HMDM_
prefer_base: True
profile:
  baseprofile: "https://raw.githubusercontent.com/ontodev/robot/master/robot-core/src/main/resources/report_profile.txt"
report_truncation_limit: 600
redownload_after_hours: 0
environment:
  ROBOT_JAR: /tools/robot.jar
  ROBOT: robot
